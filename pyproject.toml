[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "LocalPodcastLLMStudio"
version = "1.0.0"
description = "Universal 100% Local Two-Host Audio Podcast Generator using Ollama and Edge-TTS with Zero FFmpeg Dependencies"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "LocalPodcastLLMStudio Contributors" }
]
keywords = [
    "podcast",
    "ollama",
    "edge-tts",
    "customtkinter",
    "tts",
    "ai",
    "windows",
    "audio",
    "mp3",
    "local-llm"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "customtkinter>=5.2.0",
    "edge-tts>=6.1.0",
    "pypdf>=4.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.7.0",
    "mypy>=1.8.0",
    "pip-audit>=2.7.0",
    "pyinstaller>=6.3.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.1.0",
]

[project.gui-scripts]
localpodcastllmstudio = "app:main"
podcaststudio = "app:main"

[tool.setuptools]
py-modules = ["app", "check_env"]
packages = ["core", "ui"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    ".venv",
    "build",
    "dist",
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    "__pycache__",
    ".agents",
    "PROJECT.md",
    "*.md",
    "verify_*.py",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort import order
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade (Python 3.10+ modern syntax)
]
ignore = [
    "E501",   # Line too long (handled by ruff format)
]

[tool.ruff.lint.isort]
known-first-party = ["core", "ui"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = false
warn_redundant_casts = true
warn_unused_ignores = true
exclude = [
    "^\\.venv/",
    "^build/",
    "^dist/",
    "^\\.agents/",
]

[[tool.mypy.overrides]]
module = [
    "customtkinter",
    "edge_tts",
    "pypdf",
    "PyInstaller",
    "pytest",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["core", "ui", "app", "check_env"]
omit = [
    "tests/*",
    ".venv/*",
    "setup.py",
    "verify_*.py",
    ".agents/*",
]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 50
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
